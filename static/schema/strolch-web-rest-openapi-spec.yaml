openapi: 3.1.0
info:
  contact:
    email: eitch@eitchnet.ch
    name: Robert von Burg
    url: https://www.eitchnet.ch
  description: |-
    Strolch is an agent implementing a service architecture. With the exception of JAX-RS, everything is implemented in Java SE.

    All aspects of a framework for applications are implemented:
    - Parameterized model
    - Transaction management
    - Privilege management
    - Services and Commands for Use-Cases
    - Policies
    - Component lifecycle management
  license:
    name: Apache 2.0
    url: https://strolch.li
  summary: "This API implements all aspects of modifying the agent at runtime: Component\
    \ lifecycle management, Authentication, Execution control, Inspector for data\
    \ and configuration, Job control, Notification control, Privilege management"
  title: Strolch RESTful API
  version: "1.0"
externalDocs:
  description: Strolch's website
  url: https://strolch.li
tags:
- description: API to view and modify components and configuration
  name: Agent
- description: Manage and query audit logs.
  name: Audits Resource
- description: Handles user authentication
  name: Authentication
- description: Manage execution activities and states.
  name: Control Resource
- description: Provides operations to retrieve system enumerations.
  name: Enum Resource
- description: Provides operations for retrieving and updating internationalization
    data.
  name: I18n Resource
- description: Provides operations for inspecting realms and elements in various formats.
  name: Inspector
- description: Provides operations for inspecting the agent's supported languages
  name: I18n
- description: Endpoints for querying and managing Strolch models.
  name: Model
- description: Endpoints for managing user notifications.
  name: Notifications
- description: Endpoints for retrieving operations log messages.
  name: Operations Log
- description: Endpoints for managing privilege groups.
  name: Privilege Groups
- description: Endpoints for managing privilege policies.
  name: Privilege Policies
- description: Endpoints for managing privilege roles.
  name: Privilege Roles
- description: Endpoints for managing privilege users.
  name: Privilege Users
- description: API for managing reports
  name: Report API
- description: Handles Strolch job management
  name: Strolch Jobs
- description: Manages user sessions
  name: User Sessions
- description: Retrieves version information
  name: Version
paths:
  /strolch/agent/components:
    get:
      description: Retrieves all components registered in the agent.
      operationId: getComponents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrolchResponse"
          description: List of agent components.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Get agent components
      tags:
      - Agent
  /strolch/agent/components/{name}/state:
    put:
      description: Updates the state of a specific component.
      operationId: setComponentState
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrolchResponse"
          description: Component state updated successfully.
        "403":
          description: Access denied.
        "404":
          description: Component not found.
        "500":
          description: Internal server error.
      summary: Set component state
      tags:
      - Agent
  /strolch/agent/configuration/reload:
    put:
      description: Forces the agent to reload its configuration.
      operationId: reloadConfiguration
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrolchResponse"
          description: Configuration reloaded successfully.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Reload agent configuration
      tags:
      - Agent
  /strolch/agent/statistics:
    get:
      description: Retrieves runtime statistics of the agent.
      operationId: getStatistics
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrolchResponse"
          description: Agent statistics retrieved.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Get agent statistics
      tags:
      - Agent
  /strolch/audits/{realm}:
    get:
      description: Retrieves a paginated list of audits filtered by optional criteria.
      operationId: getAudits
      parameters:
      - in: path
        name: realm
        required: true
        schema:
          type: string
      - in: query
        name: offset
        schema:
          type: integer
          format: int32
          default: "0"
      - in: query
        name: limit
        schema:
          type: integer
          format: int32
          default: "50"
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
      - in: query
        name: username
        schema:
          type: string
      - in: query
        name: elementType
        schema:
          type: string
      - in: query
        name: elementSubType
        schema:
          type: string
      - in: query
        name: elementAccessed
        schema:
          type: string
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: accessType
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example: "{\"paging\": {\"offset\": 0, \"limit\": 50, \"total\": 100},\
                \ \"data\": [...] }"
          description: List of audits.
        "400":
          description: Invalid input parameters.
        "500":
          description: Internal server error.
      summary: Get audits
      tags:
      - Audits Resource
  /strolch/audits/{realm}/types:
    get:
      description: Retrieves all available audit types.
      operationId: queryTypes
      parameters:
      - in: path
        name: realm
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
              - Type1
              - Type2
          description: List of audit types.
        "500":
          description: Internal server error.
      summary: Get audit types
      tags:
      - Audits Resource
  /strolch/authentication:
    post:
      description: Processes a login request using credentials provided in the request
        body and returns an authentication token or an error.
      operationId: authenticate
      requestBody:
        content:
          application/json:
            schema:
              properties:
                keepAlive:
                  type: boolean
                password:
                  type: string
                username:
                  type: string
        description: User credentials for authentication
        required: true
      responses:
        "200":
          content:
            application/json: {}
          description: Successfully authenticated
        "400":
          description: Invalid input data
        "401":
          description: Invalid credentials
        "500":
          description: Internal server error
      summary: Authenticate a user using provided credentials
      tags:
      - Authentication
  /strolch/authentication/challenge:
    post:
      description: Starts an authentication challenge for clients requiring additional
        authentication mechanisms.
      operationId: initiateChallenge
      requestBody:
        content:
          application/json:
            schema:
              properties:
                usage:
                  type: string
                  enum:
                  - ANY
                  - SINGLE
                  - SET_PASSWORD
                username:
                  type: string
        description: User credentials for authentication
        required: true
      responses:
        "200":
          content:
            application/json: {}
          description: Challenge initiated successfully
        "400":
          description: Invalid input data
        "500":
          description: Internal server error
      summary: Initiate an authentication challenge
      tags:
      - Authentication
    put:
      description: Validates the response to an earlier initiated authentication challenge.
      operationId: validateChallenge
      requestBody:
        content:
          application/json:
            schema:
              properties:
                challenge:
                  type: string
                username:
                  type: string
        description: User credentials for authentication
        required: true
      responses:
        "200":
          content:
            application/json: {}
          description: Challenge validated successfully
        "400":
          description: Invalid challenge response
        "401":
          description: Unauthorized access
        "500":
          description: Internal server error
      summary: Validate an authentication challenge
      tags:
      - Authentication
  /strolch/authentication/sso:
    post:
      description: Handles Single Sign-On authentication and provides an authentication
        token or an error.
      operationId: authenticateSingleSignOn
      responses:
        "200":
          content:
            application/json: {}
          description: Successfully authenticated
        "401":
          description: SSO authentication failed
        "500":
          description: Internal server error
      summary: Authenticate a user through Single Sign-On (SSO)
      tags:
      - Authentication
  /strolch/authentication/{authToken}:
    delete:
      description: Invalidates a session associated with the provided authentication
        token.
      operationId: invalidateSession
      parameters:
      - in: path
        name: authToken
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Session invalidated successfully
        "401":
          description: Invalid authentication token
        "500":
          description: Internal server error
      summary: Invalidate a session
      tags:
      - Authentication
    get:
      description: Returns details of the session associated with the provided authentication
        token if valid.
      operationId: getValidatedSession
      parameters:
      - in: path
        name: authToken
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json: {}
          description: Session details retrieved successfully
        "401":
          description: Invalid authentication token
        "500":
          description: Internal server error
      summary: Get validated session details
      tags:
      - Authentication
    head:
      description: Checks if the session associated with the given authentication
        token is valid.
      operationId: validateSession
      parameters:
      - in: path
        name: authToken
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Session is valid
        "401":
          description: Invalid or expired session
        "500":
          description: Internal server error
      summary: Validate a session
      tags:
      - Authentication
    put:
      description: Extends the session validity associated with the given authentication
        token.
      operationId: refreshSession
      parameters:
      - in: path
        name: authToken
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json: {}
          description: Session refreshed successfully
        "401":
          description: Invalid or expired session
        "500":
          description: Internal server error
      summary: Refresh an active session
      tags:
      - Authentication
  /strolch/control:
    get:
      description: Retrieves all currently active execution activities in the given
        realm.
      operationId: getActivities
      parameters:
      - in: query
        name: realm
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrolchResponse"
          description: List of active execution activities.
        "500":
          description: Internal server error.
      summary: Get active execution activities
      tags:
      - Control Resource
  /strolch/control/activity/state:
    delete:
      description: Stops execution of an activity and removes it from tracking.
      operationId: removeActivityFromExecution
      parameters:
      - in: query
        name: realm
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      - in: query
        name: id
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResultResponse"
          description: Activity successfully removed from execution.
        "400":
          description: Invalid activity parameters provided.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Remove activity from execution
      tags:
      - Control Resource
    post:
      description: Starts execution of the specified activity.
      operationId: executeActivity
      parameters:
      - in: query
        name: realm
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      - in: query
        name: id
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResultResponse"
          description: Activity execution started successfully.
        "400":
          description: Invalid parameters provided.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Execute an activity
      tags:
      - Control Resource
    put:
      description: Updates the state of an activity element.
      operationId: setElementState
      parameters:
      - in: query
        name: realm
        schema:
          type: string
      - in: query
        name: locator
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResultResponse"
          description: Activity state updated successfully.
        "400":
          description: Invalid state or locator provided.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Set activity state
      tags:
      - Control Resource
  /strolch/control/all:
    delete:
      description: Removes all currently running execution activities.
      operationId: clearAllActivities
      parameters:
      - in: query
        name: realm
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResultResponse"
          description: All execution activities cleared.
        "500":
          description: Internal server error.
      summary: Clear all execution activities
      tags:
      - Control Resource
  /strolch/control/executionHandler/state:
    get:
      description: Retrieves the current state of the execution handler.
      operationId: getExecutionHandlerState
      parameters:
      - in: query
        name: realm
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrolchResponse"
          description: Execution handler state returned.
        "500":
          description: Internal server error.
      summary: Get execution handler state
      tags:
      - Control Resource
    put:
      description: Sets the state of the execution handler.
      operationId: setExecutionHandlerState
      parameters:
      - in: query
        name: realm
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResultResponse"
          description: Execution handler state updated.
        "400":
          description: Invalid state value.
        "500":
          description: Internal server error.
      summary: Set execution handler state
      tags:
      - Control Resource
  /strolch/enums/{name}:
    get:
      description: Fetches an enumeration by name with optional hidden elements filtering.
      operationId: getEnum
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      - in: query
        name: withoutHidden
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  locale:
                    type: string
                  name:
                    type: string
                  values: {}
          description: Successful retrieval of enumeration.
        "500":
          description: Internal server error.
      summary: Retrieve an enumeration
      tags:
      - Enum Resource
  /strolch/enums/{name}/{locale}:
    get:
      description: Fetches an enumeration by name with a specific locale override.
      operationId: getEnumBySpecificLocale
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      - in: path
        name: locale
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  locale:
                    type: string
                  name:
                    type: string
                  values: {}
          description: Successful retrieval of enumeration with locale.
        "500":
          description: Internal server error.
      summary: Retrieve an enumeration with specific locale
      tags:
      - Enum Resource
  /strolch/i18n/data:
    get:
      description: Fetches the internationalization data file and returns it as a
        pretty-printed JSON string.
      operationId: getI18nDataPlain
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: I18n data retrieved successfully.
        "500":
          description: Internal server error.
      summary: Retrieve I18n data as plain text
      tags:
      - I18n Resource
    put:
      description: Updates the internationalization data file with new content.
      operationId: setI18nData
      requestBody:
        content:
          application/json:
            schema: {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrolchResponse"
          description: I18n data updated successfully.
        "400":
          description: Invalid JSON format.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Update I18n data
      tags:
      - I18n Resource
  /strolch/inspector:
    get:
      description: Retrieves an overview of the available realms and their element
        counts.
      operationId: getAgentOverview
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Agent overview retrieved successfully.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Get agent overview
      tags:
      - Inspector
  /strolch/inspector/{realm}:
    get:
      description: Retrieves detailed information about a specific realm.
      operationId: getRealmOverview
      parameters:
      - in: path
        name: realm
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Realm overview retrieved successfully.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Get realm overview
      tags:
      - Inspector
  /strolch/inspector/{realm}/activities:
    get:
      description: Retrieves an overview of activities within a realm.
      operationId: getActivitiesOverview
      parameters:
      - in: path
        name: realm
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Activities overview retrieved successfully.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Get activities overview
      tags:
      - Inspector
    post:
      description: Adds a new activity to the system using XML format.
      operationId: addActivityAsXml
      parameters:
      - in: path
        name: realm
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/xml:
            schema:
              description: See https://strolch.li/schema/StrolchModel.xsd
      responses:
        "200":
          content:
            application/xml:
              schema:
                description: See https://strolch.li/schema/StrolchModel.xsd
          description: Activity added successfully.
        "400":
          description: Invalid XML format.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Add an activity as XML
      tags:
      - Inspector
  /strolch/inspector/{realm}/activities/xml:
    get:
      description: Exports all activities of a realm in XML format.
      operationId: exportActivitiesToXml
      parameters:
      - in: path
        name: realm
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/xml:
              schema:
                description: See https://strolch.li/schema/StrolchModel.xsd
          description: Activities exported successfully.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Export activities as XML
      tags:
      - Inspector
  /strolch/inspector/{realm}/activities/{type}:
    delete:
      description: Removes multiple activities of a specified type within a realm.
      operationId: removeActivitiesByType
      parameters:
      - in: path
        name: realm
        required: true
        schema:
          type: string
      - in: path
        name: type
        required: true
        schema:
          type: string
      - in: query
        name: ids
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResultResponse"
          description: Activities removed successfully.
        "400":
          description: Invalid request format.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Remove activities by type
      tags:
      - Inspector
    get:
      description: Retrieves activities of a specific type within a realm.
      operationId: queryActivitiesByType
      parameters:
      - in: query
        name: realmName
        schema:
          type: string
      - in: query
        name: offset
        schema:
          type: integer
          format: int32
      - in: query
        name: limit
        schema:
          type: integer
          format: int32
      - in: query
        name: query
        schema:
          type: string
      - in: query
        name: orderBy
        schema:
          type: string
      - in: query
        name: descending
        schema:
          type: boolean
      - in: path
        name: realm
        required: true
        schema:
          type: string
      - in: path
        name: type
        required: true
        schema:
          type: string
      - in: query
        name: overview
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Activities retrieved successfully.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Query activities by type
      tags:
      - Inspector
    post:
      description: Adds a new activity to the system using flat JSON format.
      operationId: addActivityAsJsonFlat
      parameters:
      - in: path
        name: realm
        required: true
        schema:
          type: string
      - in: path
        name: type
        required: true
        schema:
          type: string
      - in: query
        name: flat
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Activity added successfully.
        "400":
          description: Invalid JSON format.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Add an activity as JSON (flat)
      tags:
      - Inspector
  /strolch/inspector/{realm}/activities/{type}/xml:
    get:
      description: Exports all activities of a given type within a realm in XML format.
      operationId: exportActivitiesOfTypeToXml
      parameters:
      - in: query
        name: realmName
        schema:
          type: string
      - in: query
        name: offset
        schema:
          type: integer
          format: int32
      - in: query
        name: limit
        schema:
          type: integer
          format: int32
      - in: query
        name: query
        schema:
          type: string
      - in: query
        name: orderBy
        schema:
          type: string
      - in: query
        name: descending
        schema:
          type: boolean
      - in: path
        name: realm
        required: true
        schema:
          type: string
      - in: path
        name: type
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/xml:
              schema:
                description: See https://strolch.li/schema/StrolchModel.xsd
          description: Activities exported successfully.
        "403":
          description: Access denied.
        "500":
          description: Internal server error.
      summary: Export activities of a specific type as XML
      tags:
      - Inspector
  /strolch/inspector/{realm}/activities/{type}/{id}:
    delete:
      description: Removes a single activity from the system by ID.
      operationId: removeActivity
      parameters:
      - in: path
        name: realm
        required: true
        schema:
          type: string
      - in: path
        name: type
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResultResponse"
          description: Activity removed successfully.
        "403":
          description: Access denied.
        "404":
          description: Activity not found.
        "500":
          description: Internal server error.
      summary: Remove a specific activity
      tags:
      - Inspector
    get:
      description: Retrieves a specific activity in XML format.
      operationId: getActivityAsXml
      parameters:
      - in: path
        name: realm
        required: true
        schema:
          type: string
      - in: path
        name: type
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/xml:
              schema:
                description: See https://strolch.li/schema/StrolchModel.xsd
          description: Activity retrieved successfully.
        "403":
          description: Access denied.
        "404":
          description: Activity not found.
        "500":
          description: Internal server error.
      summary: Get activity as XML
