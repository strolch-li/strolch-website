components:
  schemas:
    I18nMessageResponse:
      type: object
      description: Represents an i18n message
      properties:
        exception:
          type: string
          description: The stack trace if available
        key:
          type: string
          description: The key of the i18n message
        message:
          type: string
          description: The formatted i18n message
        values:
          type: object
          additionalProperties:
            type: string
            description: formatting values
          description: formatting values
    PagingResponse:
      type: object
      description: Represents paging data
      properties:
        data:
          type: array
          description: The page of data
          items:
            description: The page of data
        dataSetSize:
          type: integer
          format: int64
          description: Total number of available records.
        lastOffset:
          type: integer
          format: int32
          description: Offset for the last set of records.
        limit:
          type: integer
          format: int32
          description: Maximum number of records returned per request.
        nextOffset:
          type: integer
          format: int32
          description: Offset for the next set of records.
        offset:
          type: integer
          format: int32
          description: Starting point for fetching records.
        previousOffset:
          type: integer
          format: int32
          description: Offset for the previous set of records.
        size:
          type: integer
          format: int32
          description: Number of records in the current page.
    ServiceResultResponse:
      type: object
      description: Represents the result of a service execution.
      properties:
        exceptionMsg:
          type: string
          description: Error message if an exception occurred.
          example: NullPointerException at line 42
        i18n:
          description: Internationalization message details if available.
        msg:
          type: string
          description: Message describing the result.
          example: Operation completed successfully.
        state:
          type: string
          description: The state of the result.
          enum:
          - SUCCESS
          - WARNING
          - FAILED
          - EXCEPTION
          - ACCESS_DENIED
          example: SUCCESS
        throwable:
          type: string
          description: Stack trace of the exception if applicable.
    StrolchResponse:
      type: object
      description: Represents a standard Strolch response
      properties:
        data:
          description: Message describing the result.
        i18n:
          $ref: "#/components/schemas/I18nMessageResponse"
          description: Internationalization message details if available.
        msg:
          type: string
          description: Message describing the result.
          example: Operation completed successfully.
